name: Django CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: your_database_name
          POSTGRES_USER: your_username
          POSTGRES_PASSWORD: your_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U your_username"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Wait for PostgreSQL to be ready
      run: |
        for i in {1..30}; do
          if pg_isready -h localhost -p 5432 -U your_username; then
            echo "PostgreSQL is ready!"
            break
          fi
          echo "Waiting for PostgreSQL..."
          sleep 1
        done

    - name: Configure Django settings for testing
      run: |
        echo "DATABASES = {
            'default': {
                'ENGINE': 'django.db.backends.postgresql',
                'NAME': '${{ secrets.POSTGRES_DB }}',
                'USER': '${{ secrets.POSTGRES_USER }}',
                'PASSWORD': '${{ secrets.POSTGRES_PASSWORD }}',
                'HOST': 'localhost',
                'PORT': '5432',
            }
        }" > myproject/settings/test_settings.py

    - name: Run migrations
      env:
        DATABASE_URL: postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}
      run: |
        python manage.py migrate --settings=myproject.settings.test_settings

    - name: Run tests
      run: |
        python manage.py test --settings=myproject.settings.test_settings

